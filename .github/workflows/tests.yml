name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"
        with:
          submodules: recursive

      - name: Install Nix
        uses: "https://github.com/cachix/install-nix-action@v31"

      - name: Build
        run: nix build

      - name: Check flake
        run: nix flake check --show-trace
