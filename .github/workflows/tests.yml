name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"
        with:
          submodules: recursive

      - name: Install Nix
        uses: "cachix/install-nix-action@v31"
        with:
          github_access_token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build
        run: nix build

      - name: Check flake
        run: nix flake check --show-trace
